<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iOS Location Changer</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        #map { height: 100vh; width: 100%; z-index: 1; }
        .controls { z-index: 1000; max-height: 95vh; overflow-y: auto; }
        .joystick-btn {
            width: 50px; height: 50px; background: #e5e7eb; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; cursor: pointer; user-select: none;
        }
        .joystick-btn:active, .joystick-btn.active { background: #3b82f6; color: white; }
    </style>
</head>
<body class="bg-gray-100 overflow-hidden">

    <div class="controls absolute top-4 left-4 bg-white p-5 rounded-lg shadow-xl w-80">
        
        <!-- CONNECTION STATUS TOGGLE -->
        <div class="flex justify-between items-center mb-4">
            <h1 class="text-2xl font-bold text-gray-800">Location Changer</h1>
            <button id="connBtn" class="bg-gray-400 text-white text-xs px-2 py-1 rounded font-bold shadow transition-colors">
                Connect
            </button>
        </div>
        
        <div class="mb-4">
            <label for="searchInput" class="block text-sm font-medium text-gray-700 mb-1">Search</label>
            <div class="flex">
                <input type="text" id="searchInput" placeholder="e.g. New York..." class="flex-1 border rounded-l px-3 py-2 text-sm">
                <button id="searchBtn" class="bg-gray-200 hover:bg-gray-300 px-3 py-2 rounded-r border border-l-0 text-sm">🔍</button>
            </div>
        </div>

        <button id="teleportBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded shadow mb-4">🚀 Teleport to Pin</button>

        <hr class="my-4">

        <!-- Speed Slider -->
        <div class="mb-4">
            <label for="speedSlider" class="block text-sm font-bold text-gray-700 mb-1">
                🏎️ Speed: <span id="speedValue" class="text-blue-600">5</span> m/s (<span id="speedMph">11</span> mph)
            </label>
            <input type="range" id="speedSlider" min="1" max="40" value="5" class="w-full">
            <div class="flex justify-between text-xs text-gray-400 mt-1">
                <span>Walk</span>
                <span>Bike</span>
                <span>Drive</span>
            </div>
        </div>

        <hr class="my-4">

        <!-- Joystick Section -->
        <div>
            <h3 class="font-bold text-gray-700 mb-2">🕹️ Joystick (WASD)</h3>
            <p class="text-xs text-gray-500 mb-2">Use keyboard WASD to walk smoothly.</p>
            <div class="flex flex-col items-center gap-2 mb-4">
                <div class="joystick-btn" id="btn-W">W</div>
                <div class="flex gap-2">
                    <div class="joystick-btn" id="btn-A">A</div>
                    <div class="joystick-btn" id="btn-S">S</div>
                    <div class="joystick-btn" id="btn-D">D</div>
                </div>
            </div>
        </div>

        <hr class="my-4">

        <!-- Route Section -->
        <div>
            <h3 class="font-bold text-gray-700 mb-2">📍 Route Simulation</h3>
            <p class="text-xs text-gray-500 mb-2">Right-click on map to add waypoints.</p>
            <button id="routeBtn" class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-2 px-4 rounded shadow mb-2">🚶 Start Route</button>
            <button id="clearRouteBtn" class="w-full bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold py-2 px-4 rounded shadow mb-4">Clear Waypoints</button>
        </div>

        <button id="restoreBtn" class="w-full bg-red-100 hover:bg-red-200 text-red-700 font-semibold py-2 px-4 rounded mt-2">
            🛑 Stop & Restore GPS
        </button>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>
    <script type="module">
        import { 
            toggleConnection, fetchStatus, searchLocationAPI, 
            teleportAPI, stopTeleportAPI, setSpeedAPI 
        } from '/static/js/api.js';
        
        import { MapManager } from '/static/js/map.js';
        import { JoystickManager } from '/static/js/joystick.js';

        const showToast = (msg) => { const t = document.createElement('div'); t.className = 'fixed top-4 right-4 bg-gray-800 text-white px-4 py-2 rounded shadow z-[9999]'; t.innerText = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 3000); };
        window.showToast = showToast;
        const mapManager = new MapManager();
        const joystickManager = new JoystickManager(mapManager);

        let isIntent = false;
        let isConnected = false;
        let speedMetersPerSecond = 5;

        // UI Event Listeners
        document.getElementById('connBtn').onclick = async () => {
            isIntent = await toggleConnection(isIntent);
        };

        document.getElementById('searchInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') document.getElementById('searchBtn').click(); });
        document.getElementById('searchBtn').onclick = async () => {
            const query = document.getElementById('searchInput').value;
            if (!query) return;
            const data = await searchLocationAPI(query);
            if (data.length > 0) {
                mapManager.updateSelection(parseFloat(data[0].lat), parseFloat(data[0].lon));
                mapManager.map.setView([data[0].lat, data[0].lon], 13);
            }
        };

        document.getElementById('teleportBtn').onclick = async () => {
            if (mapManager.selectedLat == null) return showToast('Select a location first.');
            await teleportAPI(mapManager.selectedLat, mapManager.selectedLng);
        };

        document.getElementById('restoreBtn').onclick = async () => {
            joystickManager.stopJoy();
            mapManager.clearRoute();
            await stopTeleportAPI();
        };

        document.getElementById('speedSlider').oninput = (e) => {
            speedMetersPerSecond = parseInt(e.target.value);
            document.getElementById('speedValue').innerText = speedMetersPerSecond;
            document.getElementById('speedMph').innerText = Math.round(speedMetersPerSecond * 2.23694);
        };

        document.getElementById('speedSlider').onchange = async () => {
            await setSpeedAPI(speedMetersPerSecond);
        };

        document.getElementById('routeBtn').onclick = () => {
            mapManager.startRoute(speedMetersPerSecond);
        };

        document.getElementById('clearRouteBtn').onclick = () => {
            mapManager.clearRoute();
        };

        // Connection Polling Loop
        let isFetching = false;
        setInterval(async () => {
            if (isFetching) return;
            isFetching = true;
            try {
                const data = await fetchStatus();
                isIntent = data.intent;
                isConnected = data.connected;
                
                const btn = document.getElementById('connBtn');
                if (isConnected) {
                    btn.className = "bg-green-500 hover:bg-red-500 text-white text-xs px-2 py-1 rounded font-bold shadow transition-colors";
                    btn.onmouseover = () => btn.innerText = "Disconnect";
                    btn.onmouseout = () => btn.innerText = "✓ Connected";
                    if (!btn.matches(':hover')) btn.innerText = "✓ Connected";
                } else if (isIntent) {
                    btn.className = "bg-yellow-500 text-white text-xs px-2 py-1 rounded font-bold shadow animate-pulse";
                    btn.innerText = "Connecting...";
                    btn.onmouseover = null;
                    btn.onmouseout = null;
                } else {
                    btn.className = "bg-gray-400 hover:bg-gray-500 text-white text-xs px-2 py-1 rounded font-bold shadow transition-colors";
                    btn.innerText = "Connect";
                    btn.onmouseover = null;
                    btn.onmouseout = null;
                }
            } catch (e) { console.warn('API error:', e); } finally { isFetching = false; }
        }, 1500);
    </script>
</body>
</html>
