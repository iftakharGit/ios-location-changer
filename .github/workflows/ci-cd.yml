name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*' # Trigger release on tags like v1.0.0
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: write

jobs:
  test:
    name: Run Tests & Linter
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: 'pip'
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pytest-asyncio httpx
          pip install -r requirements.txt
          
      - name: Lint with Flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 backend/ app.py tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
          
      - name: Run Pytest
        run: |
          pytest tests/

  build-and-release:
    name: Build macOS App & Release
    needs: test
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: 'pip'
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt
          
      - name: Build macOS App Bundle
        run: |
          pyinstaller --clean --windowed --name "Location Changer" --add-data "templates:templates" --add-data "static:static" --collect-all uvicorn --collect-all fastapi app.py --noconfirm
          
      - name: Zip the .app for deployment
        run: |
          cd dist
          zip -r "Location_Changer_macOS.zip" "Location Changer.app"
          
      - name: Upload Artifact (Pushes & PRs)
        uses: actions/upload-artifact@v4
        with:
          name: Location_Changer_macOS
          path: dist/Location_Changer_macOS.zip
          retention-days: 7
          
      - name: Publish GitHub Release (Tags Only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Location_Changer_macOS.zip
          generate_release_notes: true
          draft: false
          prerelease: false
